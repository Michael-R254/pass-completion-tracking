[project]
name = "passmodel"
version = "0.1.0"
description = "Pass completion probability from Metrica Sports tracking data"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "kloppy",
    "mplsoccer",
    "pandas",
    "numpy",
    "scikit-learn",
    "xgboost",
    "shap",
    "matplotlib",
    "pyarrow",
]

[dependency-groups]
dev = [
    "pytest",
    "ipykernel",
    "jupyterlab>=4.6.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/passmodel"]

[tool.pytest.ini_options]
testpaths = ["tests"]
